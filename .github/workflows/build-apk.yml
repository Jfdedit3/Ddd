name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ubuntu Plasma APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Fetch PRoot binary (arm64, Android/bionic)
        run: |
          set -euo pipefail
          mkdir -p /tmp/proot
          cd /tmp/proot
          INDEX=$(curl -fsSL https://packages.termux.dev/apt/termux-main/pool/main/p/proot/)
          FILE=$(echo "$INDEX" | grep -oE 'proot_[0-9][^"]*_aarch64\.deb' | sort -V | tail -n1)
          echo "Paquet sélectionné : $FILE"
          curl -fsSLO "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/$FILE"
          dpkg-deb -x "$FILE" extract
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp extract/data/data/com.termux/files/usr/bin/proot \
             app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Build APKs
        run: |
          gradle -p . --no-daemon assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-plasma-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
